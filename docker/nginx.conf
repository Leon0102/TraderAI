server {
    listen 80;
    # Relative redirects: keep whatever host/port the browser used (8080 locally, 443 behind Caddy).
    absolute_redirect off;
    root /usr/share/nginx/html;

    # Password gate: the backend answers 204 (allowed) or 401. With APP_PASSWORD unset it always
    # allows, so local use needs no login; on a VPS every page and API call requires a session.
    location = /_auth {
        internal;
        proxy_pass http://backend:8000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login {
        return 302 /login?next=$request_uri;
    }

    location = /login {
        proxy_pass http://backend:8000;
    }

    location /api/auth/ {
        proxy_pass http://backend:8000;
    }

    location = /api/health {
        proxy_pass http://backend:8000;
    }

    location /api/ {
        auth_request /_auth;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # AI council streams over SSE; scans and council runs can take minutes.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        auth_request /_auth;
        error_page 401 = @login;
        try_files $uri /index.html;
    }
}
